<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliance Self-Assessment — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-950:#1E241C;
    --soil-800:#2E3A28;
    --field-600:#4A6741;
    --field-500:#5C7A52;
    --field-100:#E3E9DC;
    --clay-600:#A8461F;
    --clay-100:#F3DCCB;
    --amber-600:#B8862B;
    --amber-100:#F3E6C4;
    --paper:#F6F5EF;
    --paper-card:#FFFFFF;
    --line:#DAD9CC;
    --ink:#20241E;
    --ink-soft:#5B6156;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100%;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:28px;
  }
  .brand-mark{
    width:30px;height:30px;
    border-radius:8px;
    background:var(--field-600);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
  }
  .brand-name{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .progress-rail{
    display:flex;
    gap:4px;
    margin-bottom:8px;
  }
  .progress-seg{
    height:4px;
    flex:1;
    border-radius:2px;
    background:var(--line);
    transition:background .3s ease;
  }
  .progress-seg.done{background:var(--field-600);}
  .progress-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
    margin-bottom:26px;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(30,36,28,0.04);
  }
  @media (max-width:480px){
    .card{padding:26px 20px;}
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--field-600);
    margin:0 0 12px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    line-height:1.18;
    margin:0 0 14px;
    color:var(--soil-950);
  }
  h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:23px;
    line-height:1.25;
    margin:0 0 8px;
    color:var(--soil-950);
  }
  p.lead{
    font-size:15.5px;
    line-height:1.55;
    color:var(--ink-soft);
    margin:0 0 26px;
  }
  .method-note{
    font-size:13px;
    line-height:1.5;
    color:var(--field-600);
    background:var(--field-100);
    border-radius:8px;
    padding:12px 14px;
    margin:0 0 24px;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    border-radius:10px;
    padding:13px 22px;
    transition:transform .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    background:var(--soil-950);
    color:#fff;
    width:100%;
  }
  .btn-primary:hover{background:var(--soil-800);}
  .btn-primary:disabled{
    background:#C9CBC1;
    cursor:not-allowed;
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    padding:13px 4px;
    font-weight:500;
  }
  .btn-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:28px;
  }
  .btn-row .btn-primary{width:auto;flex:1;}

  .meta-note{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* Choice cards (segmentation + options) */
  .choice-grid{
    display:grid;
    gap:10px;
  }
  .choice{
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    cursor:pointer;
    background:var(--paper-card);
    transition:border-color .12s ease, background .12s ease;
  }
  .choice:hover{border-color:var(--field-500);}
  .choice.selected{
    border-color:var(--field-600);
    background:var(--field-100);
  }
  .choice-title{font-weight:600;font-size:15px;color:var(--soil-950);}
  .choice-sub{font-size:13px;color:var(--ink-soft);margin-top:3px;}

  /* Question screen */
  .cat-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--field-100);
    color:var(--field-600);
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:100px;
    margin-bottom:16px;
  }
  .q-block{margin-bottom:22px;}
  .q-block:last-of-type{margin-bottom:0;}
  .q-text{font-size:15.5px;font-weight:500;color:var(--soil-950);margin-bottom:10px;line-height:1.4;}
  .ans-row{display:flex;gap:8px;}
  .ans-btn{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--paper-card);
    border-radius:9px;
    padding:11px 8px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    text-align:center;
    transition:all .12s ease;
  }
  .ans-btn:hover{border-color:var(--field-500);}
  .ans-btn.sel-yes{background:var(--field-600);border-color:var(--field-600);color:#fff;}
  .ans-btn.sel-partial{background:var(--amber-600);border-color:var(--amber-600);color:#fff;}
  .ans-btn.sel-no{background:var(--clay-600);border-color:var(--clay-600);color:#fff;}

  /* Results */
  .gauge-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 0 6px;
  }
  .gauge-score{
    font-family:'Fraunces',serif;
    font-size:52px;
    font-weight:700;
    line-height:1;
    margin-top:-70px;
  }
  .gauge-score span{font-size:22px;font-weight:500;color:var(--ink-soft);}
  .gauge-caption{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .breakdown{margin-top:28px;}
  .bd-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px 0;
    border-top:1px solid var(--line);
  }
  .bd-row:first-child{border-top:none;}
  .bd-dot{
    width:10px;height:10px;
    border-radius:50%;
    margin-top:5px;
    flex-shrink:0;
  }
  .bd-dot.green{background:var(--field-600);}
  .bd-dot.amber{background:var(--amber-600);}
  .bd-dot.red{background:var(--clay-600);}
  .bd-title{font-weight:600;font-size:14.5px;color:var(--soil-950);}
  .elem-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:5px;
    padding:2px 6px;
    margin-left:6px;
    vertical-align:middle;
  }
  .bd-text{font-size:13.5px;color:var(--ink-soft);margin-top:2px;line-height:1.45;}
  .sev-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.03em;
    text-transform:uppercase;
    border-radius:5px;
    padding:2px 7px;
    margin-left:6px;
    vertical-align:middle;
  }
  .sev-badge.sev-major{background:var(--clay-100);color:var(--clay-600);}
  .sev-badge.sev-minor{background:var(--amber-100);color:var(--amber-600);}
  .bd-action{
    font-size:13.5px;
    color:var(--soil-950);
    margin-top:8px;
    line-height:1.45;
    background:var(--paper);
    border-left:2.5px solid var(--field-500);
    padding:8px 10px;
    border-radius:4px;
  }
  .bd-form{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:7px;
  }

  .cta-card{
    margin-top:30px;
    background:var(--soil-950);
    border-radius:12px;
    padding:26px 26px 24px;
    color:#fff;
  }
  .cta-card h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .cta-card p{
    font-size:13.5px;
    color:#C7CEC1;
    margin:0 0 18px;
    line-height:1.5;
  }
  .email-row{display:flex;gap:8px;}
  .email-input{
    flex:1;
    border:1.5px solid #46503F;
    background:#2A3325;
    color:#fff;
    border-radius:9px;
    padding:12px 14px;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
  }
  .email-input::placeholder{color:#8B927F;}
  .email-input:focus{outline:2px solid var(--field-500);outline-offset:1px;}
  .btn-send{
    background:var(--field-600);
    color:#fff;
    white-space:nowrap;
  }
  .btn-send:hover{background:var(--field-500);}
  .disclaimer{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:16px;
    line-height:1.5;
  }
  .send-error{
    background:rgba(168,70,31,0.15);
    color:#F0C4AE;
    font-size:12.5px;
    border-radius:8px;
    padding:10px 12px;
    margin-top:10px;
    line-height:1.4;
  }

  /* Confirmation */
  .confirm-icon{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--field-100);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:18px;
  }

  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .link-btn{
    background:transparent;
    border:none;
    color:var(--field-600);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    padding:0;
  }

  .fsq5-teaser{
    margin-top:32px;
    padding-top:26px;
    border-top:1px dashed var(--line);
  }
  .fsq5-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--amber-600);
    margin-bottom:8px;
  }
  .fsq5-teaser h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    color:var(--soil-950);
    margin:0 0 8px;
  }
  .fsq5-teaser p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 12px;
  }
  .fsq5-list{
    margin:0 0 14px;
    padding-left:18px;
  }
  .fsq5-list li{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .fsq5-note{
    font-size:12.5px;
    color:var(--field-600);
    font-weight:500;
    margin:0;
  }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="brand-mark">QT</div>
    <div class="brand-name">QualityTrace · Self-Assessment</div>
  </div>

  <div id="progressWrap"></div>
  <div id="screen"></div>
</div>

<script>
// Backend URL on Render — replace with your real URL after deploying
const API_URL = 'https://qualitytrace-backend.onrender.com/diagnostico';

const categories = [
  {
    id: 'traceability',
    label: 'Traceability',
    element: 'F13',
    severity: 'Major',
    questions: [
      'Do you keep a harvest record with crop/variety, site, harvest date, and lot code?',
      'Could you demonstrate full traceability of a batch, from harvest to dispatch, if asked today?'
    ]
  },
  {
    id: 'chemicals',
    label: 'Chemical Control',
    element: 'F4',
    severity: 'Major',
    questions: [
      'Do you record every pre-harvest application with product, dose, equipment, wind conditions, and withholding period (WHP)?',
      'Do you check the withholding period before every harvest?'
    ]
  },
  {
    id: 'training',
    label: 'Training & Hygiene',
    element: 'M3 · F10',
    severity: 'Minor',
    questions: [
      'Do workers receive written food safety instructions (hygiene, handwashing, protective clothing) before handling produce?',
      'Does every worker receive basic food safety training before starting, with a record kept?'
    ]
  },
  {
    id: 'cold_chain',
    label: 'Cold Chain',
    element: 'F8',
    severity: 'Major',
    questions: [
      'Is it verified that refrigeration systems (storage/transport) operate at the specified temperature?',
      'Is there a documented maintenance and calibration plan for this equipment?'
    ]
  },
  {
    id: 'suppliers',
    label: 'Suppliers & Inputs',
    element: 'F11',
    severity: 'Minor',
    questions: [
      'Do you identify and review annually the input suppliers that could affect food safety?',
      'Do you keep compliance evidence from those suppliers (declaration, certificate, or inspection)?'
    ]
  }
];

const gapText = {
  traceability: {
    red: 'Without a harvest record by lot/destination, a product recall would be very hard to contain.',
    amber: "Traceability is partial — planting, harvest, and dispatch aren't yet linked in one verifiable record."
  },
  chemicals: {
    red: "There's no systematic record of applications — a direct risk in any audit.",
    amber: 'Applications are recorded, but without cross-checking the withholding period (WHP).'
  },
  training: {
    red: "There's no formal evidence of food safety instructions or induction for workers.",
    amber: "Training happens, but there's no signed record backing it up."
  },
  cold_chain: {
    red: 'No documented temperature verification in refrigeration/transport.',
    amber: "It's checked, but there's no documented maintenance and calibration plan."
  },
  suppliers: {
    red: "Suppliers that could affect food safety aren't identified or reviewed.",
    amber: 'They are reviewed informally, with no compliance evidence on file.'
  }
};

const gapAction = {
  traceability: {
    red: 'Start a harvest record with crop, site, date, lot code, and destination from your next harvest.',
    amber: 'Run a traceability test on a real batch, from harvest to dispatch, to see where the chain breaks.'
  },
  chemicals: {
    red: 'Starting with your next application, record: product, dose, date, equipment, wind, and withholding period (WHP).',
    amber: 'Add a WHP check against the label before clearing each harvest.'
  },
  training: {
    red: 'Write hygiene instructions and hand them to every worker before their first day.',
    amber: 'Add a signature and date to each training already given, and keep the record.'
  },
  cold_chain: {
    red: 'Log the temperature of each refrigeration system at least once per shift.',
    amber: 'Document the calibration frequency and the person responsible for each cold unit.'
  },
  suppliers: {
    red: 'List your critical input suppliers and request compliance evidence from each.',
    amber: "File each supplier's declaration or certificate in one accessible folder."
  }
};

const gapForm = {
  traceability: { red: 'Form – F13 Harvest, packing and dispatch record', amber: 'Form – F13 Traceability test' },
  chemicals: { red: 'Form – F4 Pre-harvest chemical application record', amber: 'Form – F4 Chemical inventory' },
  training: { red: 'Form – F10 Food safety instructions', amber: 'Form – M3 Training record – internal FSQ' },
  cold_chain: { red: 'Form – F8 Calibration record', amber: 'Form – F8 Preventive maintenance plan' },
  suppliers: { red: 'Form – F11 Supplier table', amber: 'Form – F11 Supplier table' }
};

let state = {
  step: 0, // 0 = intro, 1 = segmentation, 2..6 = category questions, 7 = results, 8 = confirmation
  certified: null,
  email: null,
  answers: {} // {questionKey: 'yes'|'partial'|'no'}
};

const totalQuestionSteps = categories.length;

function render() {
  const screen = document.getElementById('screen');
  const progressWrap = document.getElementById('progressWrap');
  screen.innerHTML = '';
  progressWrap.innerHTML = '';

  if (state.step >= 2 && state.step <= 1 + totalQuestionSteps) {
    const rail = document.createElement('div');
    rail.className = 'progress-rail';
    for (let i = 0; i < totalQuestionSteps; i++) {
      const seg = document.createElement('div');
      seg.className = 'progress-seg' + (i <= state.step - 2 ? ' done' : '');
      rail.appendChild(seg);
    }
    progressWrap.appendChild(rail);
    const label = document.createElement('div');
    label.className = 'progress-label';
    label.textContent = `Section ${state.step - 1} of ${totalQuestionSteps} · ${categories[state.step - 2].label}`;
    progressWrap.appendChild(label);
  }

  if (state.step === 0) renderIntro(screen);
  else if (state.step === 1) renderSegmentation(screen);
  else if (state.step >= 2 && state.step <= 1 + totalQuestionSteps) renderCategory(screen, state.step - 2);
  else if (state.step === 2 + totalQuestionSteps) renderResults(screen);
  else if (state.step === 3 + totalQuestionSteps) renderConfirmation(screen);
}

function renderIntro(screen) {
  const card = document.createElement('div');
  card.className = 'card fade-in';
  card.innerHTML = `
    <p class="eyebrow">Freshcare FSQ4.2 · Agriculture Victoria FSMS</p>
    <h1>How ready is your operation for the 2027 audit?</h1>
    <p class="lead">10 quick questions about what you already do on the farm. No sign-up, no commitment — see your result instantly, and if you want, we'll email you the full detail with an action plan.</p>
    <p class="method-note">This questionnaire is built on the Freshcare FSQ4.2 standard. The Elements shown in your result correspond to the official sections of that standard. We classify each finding as <strong>Major</strong> or <strong>Minor</strong> — the standard also defines a <strong>Critical</strong> level, but that can only be confirmed with an on-site assessment, so it's not part of this self-assessment.</p>
    <button class="btn btn-primary" id="startBtn">Start assessment (2 min)</button>
    <div class="meta-note">100% anonymous until you choose to share your email</div>
  `;
  screen.appendChild(card);
  document.getElementById('startBtn').onclick = () => { state.step = 1; render(); };
}

function renderSegmentation(screen) {
  const card = document.createElement('div');
  card.className = 'card fade-in';
  card.innerHTML = `
    <p class="eyebrow">Before you start</p>
    <h2>Is your operation currently Freshcare certified?</h2>
    <p class="lead">This helps us compare your answers against the right standard.</p>
    <div class="choice-grid">
      <div class="choice" data-val="yes">
        <div class="choice-title">Yes, we're already certified</div>
        <div class="choice-sub">We'll assess you against FSQ4.2 (valid until Jun 2027)</div>
      </div>
      <div class="choice" data-val="no">
        <div class="choice-title">No, not yet</div>
        <div class="choice-sub">We'll assess you against FSQ4.2 — the same foundation FSQ5 is built on</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="backBtn">← Back</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Continue</button>
    </div>
  `;
  screen.appendChild(card);

  card.querySelectorAll('.choice').forEach(el => {
    el.onclick = () => {
      card.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      state.certified = el.dataset.val;
      document.getElementById('nextBtn').disabled = false;
    };
  });
  document.getElementById('backBtn').onclick = () => { state.step = 0; render(); };
  document.getElementById('nextBtn').onclick = () => { state.step = 2; render(); };
}

function renderCategory(screen, idx) {
  const cat = categories[idx];
  const card = document.createElement('div');
  card.className = 'card fade-in';

  let qHtml = '';
  cat.questions.forEach((q, qi) => {
    const key = `${cat.id}_${qi}`;
    qHtml += `
      <div class="q-block">
        <div class="q-text">${q}</div>
        <div class="ans-row" data-key="${key}">
          <button class="ans-btn" data-val="yes">Yes</button>
          <button class="ans-btn" data-val="partial">Partial</button>
          <button class="ans-btn" data-val="no">No</button>
        </div>
      </div>
    `;
  });

  card.innerHTML = `
    <span class="cat-tag">${cat.label}</span>
    ${qHtml}
    <div class="btn-row">
      <button class="btn btn-ghost" id="backBtn">← Back</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Continue</button>
    </div>
  `;
  screen.appendChild(card);

  function checkComplete() {
    const done = cat.questions.every((_, qi) => state.answers[`${cat.id}_${qi}`]);
    document.getElementById('nextBtn').disabled = !done;
  }

  card.querySelectorAll('.ans-row').forEach(row => {
    const key = row.dataset.key;
    row.querySelectorAll('.ans-btn').forEach(btn => {
      if (state.answers[key] === btn.dataset.val) btn.classList.add('sel-' + btn.dataset.val);
      btn.onclick = () => {
        row.querySelectorAll('.ans-btn').forEach(b => b.className = 'ans-btn');
        btn.classList.add('sel-' + btn.dataset.val);
        state.answers[key] = btn.dataset.val;
        checkComplete();
      };
    });
  });
  checkComplete();

  document.getElementById('backBtn').onclick = () => { state.step -= 1; render(); };
  document.getElementById('nextBtn').onclick = () => { state.step += 1; render(); };
}

function scoreVal(v) { return v === 'yes' ? 2 : v === 'partial' ? 1 : 0; }

function computeResults() {
  let totalPoints = 0, maxPoints = 0;
  const catResults = categories.map(cat => {
    let pts = 0, max = 0;
    cat.questions.forEach((_, qi) => {
      const v = state.answers[`${cat.id}_${qi}`];
      pts += scoreVal(v);
      max += 2;
    });
    totalPoints += pts; maxPoints += max;
    const pct = pts / max;
    const status = pct >= 0.75 ? 'green' : pct >= 0.4 ? 'amber' : 'red';
    return { ...cat, pct, status };
  });
  return { overallPct: totalPoints / maxPoints, catResults };
}

function renderResults(screen) {
  const { overallPct, catResults } = computeResults();
  const scorePct = Math.round(overallPct * 100);
  const circumference = 2 * Math.PI * 54;
  const dash = circumference * overallPct;
  const arcColor = overallPct >= 0.75 ? 'var(--field-600)' : overallPct >= 0.4 ? 'var(--amber-600)' : 'var(--clay-600)';

  const card = document.createElement('div');
  card.className = 'card fade-in';

  let bdHtml = '';
  catResults.forEach(c => {
    if (c.status === 'green') {
      bdHtml += `
        <div class="bd-row">
          <div class="bd-dot green"></div>
          <div>
            <div class="bd-title">${c.label} <span class="elem-chip">Element ${c.element}</span></div>
            <div class="bd-text">Good compliance level in this area.</div>
          </div>
        </div>
      `;
    } else {
      const text = gapText[c.id][c.status];
      const action = gapAction[c.id][c.status];
      const form = gapForm[c.id][c.status];
      const sevClass = c.severity === 'Major' ? 'sev-major' : 'sev-minor';
      bdHtml += `
        <div class="bd-row">
          <div class="bd-dot ${c.status}"></div>
          <div style="flex:1;">
            <div class="bd-title">
              ${c.label} <span class="elem-chip">Element ${c.element}</span>
              <span class="sev-badge ${sevClass}">${c.severity} non-conformance</span>
            </div>
            <div class="bd-text">${text}</div>
            <div class="bd-action"><strong>Recommended action:</strong> ${action}</div>
            <div class="bd-form">Required record: ${form}</div>
          </div>
        </div>
      `;
    }
  });

  card.innerHTML = `
    <p class="eyebrow">Your result</p>
    <h2>Compliance assessment — FSQ4.2</h2>
    <div class="gauge-wrap">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="54" fill="none" stroke="var(--line)" stroke-width="12"/>
        <circle cx="80" cy="80" r="54" fill="none" stroke="${arcColor}" stroke-width="12"
          stroke-dasharray="${dash} ${circumference}" stroke-linecap="round"
          transform="rotate(-90 80 80)"/>
      </svg>
      <div class="gauge-score">${scorePct}<span>%</span></div>
      <div class="gauge-caption">Readiness level</div>
    </div>
    <p class="meta-note" style="margin-top:22px;">This assessment covers 6 of the 19 official FSQ4.2 Elements (~32% of the standard), referenced next to each result. We classify findings as Major or Minor — the standard's Critical level can only be confirmed on-site.</p>
    <div class="breakdown">${bdHtml}</div>

    <div class="cta-card">
      <h3>Get your report: what the standard requires and what to do about it</h3>
      <p>With the exact Freshcare Element behind each gap, plus the specific record you'll need to prepare before your next audit. One free report per grower.</p>
      <div class="email-row">
        <input type="email" class="email-input" id="emailInput" placeholder="you@email.com">
        <button class="btn btn-send" id="sendBtn">Send</button>
      </div>
      <div id="sendError" class="send-error" style="display:none;"></div>
      <div class="disclaimer">This assessment is indicative and helps you prepare — it doesn't replace an official Freshcare audit or serve as compliance evidence on its own.</div>
    </div>
  `;
  screen.appendChild(card);

  document.getElementById('sendBtn').onclick = async () => {
    const val = document.getElementById('emailInput').value;
    const errorBox = document.getElementById('sendError');
    const btn = document.getElementById('sendBtn');
    errorBox.style.display = 'none';

    if (!val || !val.includes('@')) {
      document.getElementById('emailInput').style.borderColor = 'var(--clay-600)';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: val,
          certified: state.certified,
          answers: state.answers
        })
      });

      if (res.status === 409) {
        errorBox.textContent = "You've already generated your free report with this email. Contact us at qualitytrace.au@gmail.com if you need another one.";
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send';
        return;
      }

      if (!res.ok) throw new Error('request_failed');

      state.email = val;
      state.step += 1;
      render();
    } catch (err) {
      errorBox.textContent = "We couldn't send your report. Check your connection and try again.";
      errorBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  };
}

function renderConfirmation(screen) {
  const card = document.createElement('div');
  card.className = 'card fade-in';
  card.innerHTML = `
    <div class="confirm-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#4A6741" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2>Report on its way</h2>
    <p class="lead">We sent your full assessment to <strong>${state.email || 'your email'}</strong>. Check your spam folder just in case.</p>
    <p class="lead">If you'd like to close these gaps before 2027, let's talk about what level of support makes sense for you.</p>
    <button class="btn btn-primary" id="restartBtn">View support services</button>
    <div style="text-align:center;margin-top:14px;">
      <button class="link-btn" id="againBtn">Retake the assessment</button>
    </div>

    <div class="fsq5-teaser">
      <div class="fsq5-eyebrow">Coming soon</div>
      <h3>FSQ5 launches in September 2026</h3>
      <p>We'll update this assessment with the new version's official questions and Elements as soon as it's available. Here's what we already know is changing:</p>
      <ul class="fsq5-list">
        <li>Food Safety and Supply Chain merge into a single standard</li>
        <li>Structure reorganized into Sections → Modules → Elements</li>
        <li>Greater emphasis on risk assessment and food safety culture</li>
        <li>A formal biosecurity module is introduced for the first time</li>
      </ul>
      <p class="fsq5-note">We'll email you when you can retake your assessment with the updated version.</p>
    </div>
  `;
  screen.appendChild(card);
  document.getElementById('restartBtn').onclick = () => alert('→ In production, this would go to joseportal.github.io/services');
  document.getElementById('againBtn').onclick = () => {
    state = { step: 0, certified: null, email: null, answers: {} };
    render();
  };
}

render();
</script>
</body>
</html>
